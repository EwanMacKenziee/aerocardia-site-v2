name: Update blog index

on:
  push:
    branches: [master]
    paths:
      - 'blog-*.html'
      - 'scripts/build-blog-index.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-blog-index.mjs
      - name: Commit changes, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add blog.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Update blog index"
          git push
